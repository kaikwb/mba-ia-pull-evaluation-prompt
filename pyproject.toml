[project]
name = "mba-ia-pull-evaluation-prompt"
version = "0.1.0"
description = "The second techinical challenge for Full Cycle MBA IA"
readme = "README.md"
authors = [
    { name = "Kaik Bassanelli", email = "kaikwb@hotmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "langchain-core>=1.6.6,<2",
    "langchain-google-genai>=4.4.0,<5",
    "langchain-openai>=1.6.7,<2",
    "langsmith>=0.14.4,<1",
    "pydantic>=2.13.5,<3",
    "pytest>=9.1.1,<10",
    "python-dotenv>=1.2.4,<2",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1,<1",
    "pyrefly>=1.3.2,<2",
    "ruff>=0.16.10,<1",
]

[tool.uv]
package = false

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
